<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VANTA FILM — Contact</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0b0b0b;color:#eee;font-family:'DM Sans',sans-serif;min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:clamp(40px,8vw,80px) clamp(32px,8vw,80px)}
.label-top{font-family:'Outfit',sans-serif;font-size:10px;letter-spacing:.32em;text-transform:uppercase;color:rgba(238,236,232,.28);margin-bottom:clamp(36px,5vw,56px)}
ul{list-style:none;display:flex;flex-direction:column}
li{border-top:1px solid rgba(255,255,255,.07);padding:clamp(18px,2.5vw,26px) 0}
.item-label{font-size:9px;letter-spacing:.25em;text-transform:uppercase;color:rgba(238,236,232,.28);margin-bottom:7px}
.item-value{font-size:clamp(15px,2.2vw,19px);font-weight:300;color:#eee}
a{color:#eee;text-decoration:none}
a:hover{opacity:.6;transition:opacity .2s}
.footer-copy{font-family:'Outfit',sans-serif;font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:rgba(238,236,232,.16);margin-top:clamp(40px,6vw,64px)}
.back-btn{position:fixed;top:clamp(16px,2.5vw,28px);left:clamp(16px,4vw,40px);font-family:'DM Sans',sans-serif;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:rgba(238,236,232,.45);background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);padding:9px 18px;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;text-decoration:none;transition:color .2s,background .2s}
.back-btn:hover{color:#eee;background:rgba(255,255,255,.1)}
</style>
</head>
<body>
<a class="back-btn" href="javascript:window.close()" onclick="window.close();return false;">← CLOSE</a>
<div class="label-top">VANTA FILM — GET IN TOUCH</div>
<ul>
  <li>
    <div class="item-label">Email</div>
    <div class="item-value"><a href="mailto:whiterecoder@gmail.com">whiterecoder@gmail.com</a></div>
  </li>
  <li>
    <div class="item-label">YouTube</div>
    <div class="item-value"><a href="https://www.youtube.com/@vatapresent" target="_blank">@vatapresent</a></div>
  </li>
  <li>
    <div class="item-label">Phone</div>
    <div class="item-value"><a href="tel:+821048261080">+82 10 4826 1080</a></div>
  </li>
  <li>
    <div class="item-label">Business</div>
    <div class="item-value" style="font-size:clamp(13px,1.6vw,15px);color:rgba(238,236,232,.45)">반타필름 · 사업자등록번호 165-74-00517</div>
  </li>
</ul>
<div class="footer-copy">COPYRIGHT &copy; 2024 VANTA FILM. ALL RIGHTS RESERVED.</div>
<script>
(function(){
  const btn=document.createElement('button');
  btn.innerHTML='↑';
  btn.style.cssText='position:fixed;bottom:24px;right:24px;z-index:400;width:44px;height:44px;border-radius:50%;background:rgba(238,236,232,.1);border:1px solid rgba(238,236,232,.18);color:#eee;font-size:18px;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .25s;touch-action:manipulation;-webkit-tap-highlight-color:transparent';
  document.body.appendChild(btn);
  window.addEventListener('scroll',function(){
    var show=window.scrollY>200;
    btn.style.opacity=show?'1':'0';
    btn.style.pointerEvents=show?'auto':'none';
  },{passive:true});
  btn.addEventListener('click',function(){window.scrollTo({top:0,behavior:'smooth'});});
})();
</script>
</body>
</html>
